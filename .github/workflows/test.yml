name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the version in the Dockerfile
          cache: npm
      # The PDF converter (commons convert) calls the poppler tools; without them its test is skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # The same tests against the PostgreSQL store, on PGlite (PostgreSQL inside the test process).
      - run: npm run test:pg
      # Known vulnerabilities in what is deployed. Reported, but a new advisory does not turn the tests red.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
