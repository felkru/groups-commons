name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the version in the Dockerfile
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # Known vulnerabilities in what is deployed. Reported, but a new advisory does not turn the tests red.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
